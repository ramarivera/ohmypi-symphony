default_provider = "age"

[providers.age]
type = "age"
recipients = ["age1hx3ulr3sgvywwceg3nujh8lr0e7emvl86333kpjvkpsqaq8wdcds29f4xz"]
key_file = "~/.config/mise/age.txt"

[secrets]
LINEAR_CLIENT_ID= { provider = "age", value = "" }
LINEAR_CLIENT_SECRET= { provider = "age", value = "" }
LINEAR_WEBHOOK_SECRET= { provider = "age", value = "" }
TOKEN_ENCRYPTION_KEY= { provider = "age", value = "" }
PUBLIC_URL= { provider = "age", value = "" }
GITHUB_APP_ID= { provider = "age", value = "" }
GITHUB_APP_PRIVATE_KEY= { provider = "age", value = "" }
# Encrypted Linear gateway secrets. `fnox set <KEY>` adds ciphertext here
# using the configured default age provider; plaintext is only exposed to
# child processes launched through `fnox exec`.
#
# Required runtime values:
# - LINEAR_CLIENT_ID
# - LINEAR_CLIENT_SECRET
# - LINEAR_WEBHOOK_SECRET
# - TOKEN_ENCRYPTION_KEY
# - PUBLIC_URL
# - LINEAR_ALLOWED_ORGANIZATION_IDS (comma-separated organization IDs; configure
#   with `fnox set LINEAR_ALLOWED_ORGANIZATION_IDS`, never commit plaintext)